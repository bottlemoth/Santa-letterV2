name: santa-letter

# Wszystkie sekrety pochodzą z pliku .env (patrz .env.example).
# Składnia ${VAR:?komunikat} zatrzymuje start, jeśli zmienna nie jest ustawiona.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Tylko loopback — przydatne do pracy lokalnej; aplikacja łączy się przez sieć wewnętrzną.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: runtime
    image: santa-letter-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?Ustaw SESSION_SECRET w .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - backend

  # Testy w kontenerze:  docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: santa-letter-test:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      SESSION_SECRET: test-session-secret-only-for-tests
      UPLOAD_DIR: /tmp/santa-uploads-test
    networks:
      - backend

volumes:
  pgdata:
  uploads:

networks:
  backend:
    driver: bridge
